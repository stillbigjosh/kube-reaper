[package]
name = "kube-reaper"
version = "0.1.0"
edition = "2021"
description = "Kubernetes RBAC attack path mapper - enumerate permissions, flag dangerous misconfigurations, and chain attack paths from your current identity to cluster compromise"
license = "MIT"

[dependencies]
kube = { version = "0.98", features = ["client", "runtime", "rustls-tls"], default-features = false }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
secrecy = "0.10"
http = "1"
thiserror = "2"
futures = "0.3"

[profile.release]
strip = true
lto = true
opt-level = "z"
